{% extends "base.html" %}

{% block title %}New Classroom - AssessFlow{% endblock %}

{% block breadcrumbs %}
<div class="breadcrumbs">
    <a href="{{ url_for('classrooms.list_classrooms') }}">Classrooms</a>
    <span class="sep">&rsaquo;</span>
    <span>New Classroom</span>
</div>
{% endblock %}

{% block content %}
<h1>Create New Classroom</h1>
<p class="page-subtitle">Add a classroom to organize students and assessments.</p>

<div class="section-card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Classroom Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Grade 7 - Section A">
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Create Classroom</button>
            <a href="{{ url_for('classrooms.list_classrooms') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
